<!DOCTYPE html>
<html>
<head>
    <title>SentinelNIDS Dashboard</title>
</head>
<body>
    <h1>🛡️ SentinelNIDS</h1>
    <p>Network Intrusion Detection System</p>

    <h2>Security Statistics</h2>

    <div id="stats"></div>

    <h2>Recent Alerts</h2>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Rule</th>
                <th>Source IP</th>
                <th>Severity</th>
                <th>Risk</th>
            </tr>
        </thead>
        <tbody id="alerts"></tbody>
    </table>

    <script>
        async function loadDashboard() {
            const stats = await fetch("/stats").then(r => r.json());
            const alerts = await fetch("/alerts").then(r => r.json());

            document.getElementById("stats").innerHTML = `
                Total Alerts: ${stats.total_alerts}<br>
                High Severity: ${stats.high_severity}<br>
                Critical Risk: ${stats.critical_risk}<br>
                Port Scans: ${stats.port_scans}
            `;

            document.getElementById("alerts").innerHTML =
                alerts.map(a => `
                    <tr>
                        <td>${a.id}</td>
                        <td>${a.rule}</td>
                        <td>${a.source_ip}</td>
                        <td>${a.severity}</td>
                        <td>${a.risk_score} (${a.risk_level})</td>
                    </tr>
                `).join("");
        }

        loadDashboard();
    </script>
</body>
</html>
